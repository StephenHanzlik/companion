name: companion

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: companion
      POSTGRES_DB: companion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companion -d companion"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./backend/db/migrate:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://companion:companion@postgres:5432/companion?sslmode=disable",
        "up",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: postgres:16-alpine
    volumes:
      - ./backend/db/seed:/seed
    entrypoint:
      ["sh", "-c", "psql postgres://companion:companion@postgres:5432/companion?sslmode=disable -f /seed/seed.sql"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://companion:companion@postgres:5432/companion?sslmode=disable
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      seed:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
